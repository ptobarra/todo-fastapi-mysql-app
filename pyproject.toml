[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"] # pyflakes, pycodestyle, isort, pyupgrade, bugbear
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["TodoApp/test"]
asyncio_mode = "strict"
